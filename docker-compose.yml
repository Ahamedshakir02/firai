services:
  db:
    image: postgres:16-alpine
    container_name: firai_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-firai_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firai} -d ${POSTGRES_DB:-firai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: firai_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://firai:firai_secret@db:5432/firai_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY:-}
      - BHASHINI_USER_ID=${BHASHINI_USER_ID:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./backend:/app
    restart: unless-stopped
    # Health check: backend must finish seeding + model warmup before frontend starts
    # start_period gives the backend time to boot without counting failures
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 90s   # gives backend ~90s to load model + seed before checks begin

  frontend:
    build: ./frontend
    container_name: firai_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy   # wait for backend to finish startup before proxying
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  pgdata:
